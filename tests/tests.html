<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studiedashboard tests</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 820px; margin: 32px auto; padding: 0 16px; background: Canvas; color: CanvasText; }
    h1 { font-size: 22px; }
    #summary { padding: 12px 16px; border-radius: 10px; font-weight: 700; }
    .pass { background: #e6f4ec; color: #1f7a4d; }
    .fail { background: #fdecea; color: #b4231a; }
    ul { list-style: none; padding: 0; font-size: 14px; }
    li { padding: 4px 0; border-bottom: 1px solid rgba(128,128,128,.2); }
    li.bad { color: #b4231a; }
    small { display: block; opacity: .8; }
  </style>
</head>
<body>
  <h1>Studiedashboard: tests</h1>
  <p>Deze pagina controleert de rekenregels en de opslag. Je eigen gegevens worden hier niet gebruikt of aangepast.</p>
  <div id="summary">Bezig…</div>
  <ul id="list"></ul>
  <script src="../app/core.js"></script>
  <script src="test-runner.js"></script>
  <script src="core.test.js"></script>
  <script>
    (function () {
      var list = document.getElementById('list');
      var res = TR.run(function (r) {
        var li = document.createElement('li');
        li.className = r.ok ? '' : 'bad';
        li.textContent = (r.ok ? '✓ ' : '✗ ') + r.name;
        if (!r.ok) { var s = document.createElement('small'); s.textContent = r.error; li.appendChild(s); }
        list.appendChild(li);
      });
      var sum = document.getElementById('summary');
      sum.className = res.failed ? 'fail' : 'pass';
      sum.textContent = res.failed
        ? res.failed + ' van ' + res.total + ' tests mislukt.'
        : 'Alle ' + res.total + ' tests geslaagd.';
    })();
  </script>
</body>
</html>
